<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>六爻起卦工具</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">

        <header class="header">
            <h1><span class="coin-icon">🪙</span> 六爻起卦</h1>
            <div class="header-actions">
                <button class="btn btn-secondary btn-sm" onclick="openHistoryModal()">📜 历史</button>
                <button class="btn btn-secondary btn-sm" onclick="resetAll()">↺ 重来</button>
            </div>
        </header>

        <!-- ===== 第一步：问题 ===== -->
        <div class="card" id="stepQuestion">
            <div class="card-title">📝 你想问什么？</div>
            <div class="card-sub">把问题写清楚，AI解读时才能更精准地针对你的情况。</div>
            <textarea class="question-input" id="questionInput" placeholder="例：这次跳槽的offer要不要接？"></textarea>
            <div style="margin-top:14px;text-align:right;">
                <button class="btn btn-primary" onclick="startCasting()">开始起卦 →</button>
            </div>
        </div>

        <!-- ===== 第二步：起卦 ===== -->
        <div class="card hidden" id="stepCasting">
            <div class="card-title">
                🪙 起卦
                <span class="badge" id="modeBadge">电子铜钱</span>
            </div>
            <div class="card-sub" id="castingHint">心念问题，点击「抛铜钱」——每次只抛一次</div>

            <div class="mode-toggle">
                <button class="btn active" data-mode="electronic" onclick="switchMode('electronic')">⚡ 电子铜钱</button>
                <button class="btn" data-mode="manual" onclick="switchMode('manual')">✋ 真实抛币</button>
            </div>

            <div class="coin-area">
                <div class="coin-step" id="stepDisplay">第 1 次 <span class="sub">（初爻）</span></div>

                <div class="coin-container" id="coinContainer">
                    <div class="coin-wrapper" id="wrapper1">
                        <div class="coin-placeholder">?</div>
                    </div>
                    <div class="coin-wrapper" id="wrapper2">
                        <div class="coin-placeholder">?</div>
                    </div>
                    <div class="coin-wrapper" id="wrapper3">
                        <div class="coin-placeholder">?</div>
                    </div>
                </div>

                <div class="coin-actions">
                    <button class="btn btn-primary" id="throwBtn" onclick="throwOnce()">🔄 抛铜钱</button>
                    <div class="manual-options hidden" id="manualOptions">
                        <button class="btn btn-secondary" onclick="manualSelect(3)">三正</button>
                        <button class="btn btn-secondary" onclick="manualSelect(2)">二正一反</button>
                        <button class="btn btn-secondary" onclick="manualSelect(1)">一正二反</button>
                        <button class="btn btn-secondary" onclick="manualSelect(0)">三反</button>
                    </div>
                    <div class="manual-hint" id="manualHint">【花】为阳（反面） · 【字】为阴（正面）</div>
                    <div class="result-hint" id="resultHint"></div>
                </div>
            </div>

            <!-- 爻位记录 -->
            <div class="yao-record" id="yaoRecord">
                <div class="yao-row" data-index="5"><span class="label">上爻</span><span class="yao-line" id="yao6">⚫</span><span class="status" id="status6">待定</span></div>
                <div class="yao-row" data-index="4"><span class="label">五爻</span><span class="yao-line" id="yao5">⚫</span><span class="status" id="status5">待定</span></div>
                <div class="yao-row" data-index="3"><span class="label">四爻</span><span class="yao-line" id="yao4">⚫</span><span class="status" id="status4">待定</span></div>
                <div class="yao-row" data-index="2"><span class="label">三爻</span><span class="yao-line" id="yao3">⚫</span><span class="status" id="status3">待定</span></div>
                <div class="yao-row" data-index="1"><span class="label">二爻</span><span class="yao-line" id="yao2">⚫</span><span class="status" id="status2">待定</span></div>
                <div class="yao-row" data-index="0"><span class="label">初爻</span><span class="yao-line" id="yao1">⚫</span><span class="status" id="status1">待定</span></div>
            </div>
            <div class="progress-text" id="progressText">0 / 6</div>
        </div>

        <!-- ===== 第三步：结果 ===== -->
        <div class="card hidden" id="stepResult">
            <div class="card-title">🔮 卦象结果</div>
            <div class="card-sub">你的问题：<span id="resultQuestion" style="color:#e8ddd0;"></span></div>

            <div class="result-grid">
                <div class="result-item"><div class="label">本卦</div><div class="value" id="resultBenGua">—</div></div>
                <div class="result-item"><div class="label">变卦</div><div class="value" id="resultBianGua">—</div></div>
                <div class="result-item"><div class="label">动爻</div><div class="value" id="resultDongYao">无</div></div>
                <div class="result-item"><div class="label">卦象</div><div class="value" id="resultGuaXiang">—</div></div>
            </div>

            <div class="result-yao-detail" id="resultYaoDetail"></div>

            <div class="copy-area">
                <button class="btn btn-primary" onclick="copyResult()">📋 复制卦象</button>
                <button class="btn btn-secondary" onclick="resetAll()">🔄 重新起卦</button>
            </div>
        </div>

        <div style="text-align:center;padding:16px 0 6px;border-top:1px solid #3d2e22;margin-top:6px;font-size:12px;color:#5a4f42;">
            🪙 铜钱起卦 · 记录真实卦象 · 复制后交给AI解读
        </div>
    </div>

    <!-- ===== 弹窗 历史记录 ===== -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('historyModal')">✕</button>
            <h3>📜 起卦历史</h3>
            <div class="sub">点击记录可恢复查看卦象</div>
            <div id="historyList"></div>
            <div style="margin-top:12px;display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-danger btn-sm" onclick="clearAllHistory()">🗑 清空</button>
                <button class="btn btn-primary btn-sm" onclick="closeModal('historyModal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- ===== 弹窗 AI跳转 ===== -->
    <div class="modal-overlay" id="aiModal">
        <div class="modal-box" style="max-width:480px;">
            <button class="close-btn" onclick="closeModal('aiModal')">✕</button>
            <h3>🤖 选择 AI 平台</h3>
            <div class="sub">卦象已复制，点击平台直达官网，粘贴即可解读</div>
            <div class="platform-grid">
                <button class="btn" onclick="openAI('chatgpt')">ChatGPT</button>
                <button class="btn" onclick="openAI('deepseek')">DeepSeek</button>
                <button class="btn" onclick="openAI('gemini')">Gemini</button>
                <button class="btn" onclick="openAI('claude')">Claude</button>
            </div>
            <div style="text-align:right;">
                <button class="btn btn-secondary btn-sm" onclick="closeModal('aiModal')">关闭</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
